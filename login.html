<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#211824">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nythar">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/pwa-192.png">
    <title>Nythar - Dashboard & Chatbot | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style type="text/tailwindcss">
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* Previne zoom automático iOS em inputs */
        @media (max-width: 767px) {
            input { font-size: 16px !important; }
            /* Padding menor em telas muito pequenas */
            .login-card { padding: 1.5rem !important; }
        }
    </style>
    <script>
        const savedDarkMode = localStorage.getItem('hair_dark_mode');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedDarkMode === 'true' || (savedDarkMode === null && prefersDark)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-br from-[#111827] to-[#172033] min-h-screen flex items-center justify-center p-4">
    
    <div class="login-card bg-white rounded-xl w-full max-w-md p-8 shadow-2xl overflow-hidden relative">
        <!-- Logo/Header -->
        <div class="flex items-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-xl bg-[#111827] text-white flex items-center justify-center shadow-inner">
                <i class="fas fa-scissors text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-gray-950 tracking-tight">Nythar</h1>
                <p class="text-sm text-gray-500 font-bold uppercase tracking-wider">Dashboard &amp; Chatbot</p>
            </div>
        </div>

        <!-- Erro -->
        <div id="loginError" class="hidden bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-lg mb-6 text-sm font-bold flex items-center gap-2 animate-shake">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorMsg">Usuário ou senha inválidos</span>
        </div>

        <!-- Form -->
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-black text-gray-400 uppercase mb-1 ml-1">Usuário</label>
                <input id="loginUser" type="text" placeholder="Digite seu usuário" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-semibold text-gray-700" autofocus>
            </div>
            <div>
                <label class="block text-xs font-black text-gray-400 uppercase mb-1 ml-1">Senha</label>
                <input id="loginPass" type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-semibold text-gray-700" onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            
            <button onclick="doLogin()" id="btnLogin" class="bg-[#111827] hover:bg-black text-white font-bold py-3 px-6 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 w-full mt-2">
                <span>Entrar no Sistema</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="text-center mt-6">
                <button onclick="alert('Contate o administrador para resetar sua senha.')" class="text-xs text-gray-400 font-bold hover:text-blue-600 transition-colors">
                    Esqueceu suas credenciais?
                </button>
            </div>
        </div>

        <!-- Rodapé -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400 font-bold uppercase">Nythar &copy; 2026</p>
        </div>
    </div>

    <script>
        // Verifica se já está logado
        if (localStorage.getItem('hair_token')) {
            if (localStorage.getItem('hair_role') === 'superadmin') {
                window.location.href = 'superadmin/index.html';
            } else {
                window.location.href = 'dashboard-improved.html';
            }
        }

        async function doLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('loginError');

            if (!user || !pass) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> Autenticando...';
            errorDiv.classList.add('hidden');

            try {
                // Chamamos a API do Dashboard (porta 4000) para registrar a sessão corretamente
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ Username: user, Password: pass })
                });

                let data = {};
                const contentType = response.headers.get('content-type');
                // Verifica se há conteúdo JSON antes de tentar processar para evitar erro de "Unexpected end of JSON input"
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                }

                if (response.ok && data.token) {
                    localStorage.setItem('hair_token', data.token);
                    localStorage.setItem('hair_role', data.role);
                    if (data.barberId) localStorage.setItem('hair_barberId', data.barberId);
                    if (data.storeId) localStorage.setItem('hair_storeId', data.storeId);
                    if (data.storeName) localStorage.setItem('hair_store_name', data.storeName);
                    if (data.businessType) localStorage.setItem('hair_business_type', data.businessType);
                    if (data.bridgeUrl) localStorage.setItem('hair_bridge_url', data.bridgeUrl);
                    if (data.role === 'superadmin') {
                        window.location.href = 'superadmin/index.html';
                    } else {
                        window.location.href = 'dashboard-improved.html';
                    }
                } else {
                    throw new Error(data.error || 'Usuário ou senha incorretos');
                }
            } catch (err) {
                document.getElementById('errorMsg').innerText = err.message;
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar no Sistema</span><i class="fas fa-arrow-right"></i>';
            }
        }
    </script>
</body>
</html>
