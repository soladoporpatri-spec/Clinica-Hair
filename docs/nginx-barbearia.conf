# =============================================================================
#  nginx-barbearia.conf — Reverse proxy nginx para Nythar
#
#  Instalação:
#    sudo cp nginx-barbearia.conf /etc/nginx/sites-available/barbearia
#    sudo sed -i 's|SEU_DOMINIO|seudominio.com|g' /etc/nginx/sites-available/barbearia
#    sudo ln -s /etc/nginx/sites-available/barbearia /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#    # HTTPS com Let's Encrypt (após DNS apontar para a VPS):
#    sudo certbot --nginx -d seudominio.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Tamanho máximo de upload (ex: QR code, imagens de perfil)
    client_max_body_size 10M;

    # ── Dashboard + API Node.js (porta 4000) ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket / SSE (SignalR e atualizações em tempo real)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para SSE/long-poll
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── Backend ASP.NET (porta 5000) — rotas /api/* ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── SignalR Hub ───────────────────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── Health check (não registra em access.log) ─────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # ── Segurança básica ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;
}
# certbot insere o bloco HTTPS aqui automaticamente após: certbot --nginx -d SEU_DOMINIO
