services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: deploy/.env.example
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      BACKEND_URL: http://backend:5000
      BRIDGE_URL: http://bridge:3000
      BARBEARIA_DATA_DIR: /data
    volumes:
      - backend-data:/data
      - backend-backups:/backups
      - backend-logs:/logs
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    env_file: deploy/.env.example
    environment:
      BACKEND_URL: http://backend:5000
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - bridge-session:/app/.wwebjs_auth
      - bridge-data:/app/../data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: deploy/.env.example
    environment:
      BACKEND_URL: http://backend:5000
      BRIDGE_URL: http://bridge:3000
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - backend
      - bridge
    restart: unless-stopped

volumes:
  backend-data:
  backend-backups:
  backend-logs:
  bridge-session:
  bridge-data:
