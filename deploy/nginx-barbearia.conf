map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=barbearia_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=barbearia_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=barbearia_public_booking:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bootstrap por IP publico. Em producao com dominio, ajuste server_name e rode:
    # sudo certbot --nginx -d app.seudominio.com

    root /opt/barbearia;
    index login.html dashboard-improved.html;

    client_max_body_size 20m;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/barbearia.access.log;
    error_log /var/log/nginx/barbearia.error.log warn;

    location = / {
        return 302 /login.html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/deep {
        proxy_pass http://127.0.0.1:4000/health/deep;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/auth/(login|recover)$ {
        limit_req zone=barbearia_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/public/booking {
        limit_req zone=barbearia_public_booking burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/api/public/booking;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /api/ {
        limit_req zone=barbearia_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:4000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /superadmin/ {
        try_files $uri $uri/ /superadmin/index.html;
    }

    location ~ ^/(dashboard-improved\.html|login\.html|script-dashboard\.js|style-dashboard\.css|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(WhatsAppBot\.Worker|WhatsAppBridge|deploy|data|logs|backups|node_modules|tmpbuild|tmpbuild_publish|dist|tests|scripts)/ {
        deny all;
    }

    location / {
        try_files $uri =404;
    }
}
